name: arxiv-digest

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send email for this manual run?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  schedule:
    - cron: "17 19 * * *"  # 03:17 Asia/Shanghai the next day; avoid the busy start of the hour

# Queue runs: never cancel a job between sending mail and persisting state.
concurrency:
  group: arxiv-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Record invocation details
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_SCHEDULE: ${{ github.event.schedule || 'manual' }}
          MANUAL_SEND_EMAIL: ${{ inputs.send_email || 'false' }}
        shell: bash
        run: |
          {
            printf '### arxiv-digest invocation\n\n'
            printf -- '- Started (Asia/Shanghai): `%s`\n' "$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
            printf -- '- Trigger: `%s`\n' "$RUN_EVENT"
            printf -- '- Schedule expression (UTC): `%s`\n' "$RUN_SCHEDULE"
            printf -- '- Daily target: 03:17 Asia/Shanghai; GitHub may delay scheduled runs.\n'
            printf -- '- Manual send_email input: `%s` (scheduled runs use the email config).\n' "$MANUAL_SEND_EMAIL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout latest state on the triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test pipeline
        run: python -m unittest discover -s tests -v

      - name: Run tracker
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || vars.EMAIL_TO }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER || vars.EMAIL_SENDER }}
          SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EVENT: ${{ github.event_name }}
          SEND: ${{ inputs.send_email || 'false' }}
          ARXIV_TIMEOUT: "30"
          ARXIV_MAX_ATTEMPTS: "4"
          ARXIV_PAUSE: "10"
          ARXIV_MAX_SLEEP: "60"
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=(--no-email --no-state-update)
          if [ "$EVENT" = "schedule" ] || [ "$SEND" = "true" ]; then
            EXTRA=()
          fi
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          python -m arxiv_tracker.cli run \
            --config config.yaml --site-dir docs \
            --site-url "https://${OWNER}.github.io/${NAME}/" \
            "${EXTRA[@]}" --verbose

      - name: Commit site and dedup state after success
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update digest, site & dedup state"
          file_pattern: "docs/** outputs/** .state/**"

      - name: Preserve outputs for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/**
          if-no-files-found: ignore
          retention-days: 14
