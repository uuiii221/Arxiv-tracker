# This replaces the redundant daily fetch job with side-effect-free CI.
name: tests

on:
  push:
    paths:
      - "arxiv_tracker/**"
      - "tests/**"
      - "*.py"
      - "requirements*.txt"
      - "config.yaml"
      - ".github/workflows/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
