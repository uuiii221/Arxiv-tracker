categories:
  - "cs.CV"
  - "cs.LG"
  - "cs.AI"
  - "eess.IV"
  - "physics.med-ph"

keywords:
  - "segmentation"

# 组内 OR、组间 AND：分割 AND 半监督 AND 医学场景。
# 不以 self-supervised / few-shot / weakly-supervised 替代半监督条件。
keyword_groups:
  - ["semi-supervised", "semisupervised"]  # 自动包含 semi supervised 写法
  - ["medical", "biomedical", "organ", "lesion", "tumor", "tumour",
     "cardiac", "brain", "liver", "prostate", "pancreas", "retinal",
     "polyp", "MRI", "CT", "ultrasound", "histopathology"]

exclude_keywords: []
  
logic: "AND"                 # 组间逻辑：categories 与 keywords 间 AND/OR
max_results: 5
sort_by: "lastUpdatedDate"  # 按更新时间检索；已读论文的 v2/v3 不重复推送
sort_order: "descending"

# zh / en / both
lang: "both"

# —— 摘要设置 ——
# mode: none / heuristic / llm
summary:
  mode: llm # mode: "heuristic"
  # scope: tldr / full / both
  scope: "both"

# —— 邮件发送（QQ 邮箱） ——
email:
  enabled: true
  subject: "[arXiv] 半监督医学图像分割论文速递"
  smtp_server: "smtp.qq.com"
  smtp_port: 587
  smtp_pass_env: "SMTP_PASS"
  tls: "starttls"  # auto / ssl / starttls
  debug: false     # true 可打印 SMTP 调试日志
  detail: "full"  # simple / full
  max_items: 30
  attach_md: true  # 是否开启Markdown附件
  attach_pdf: false  # 是否开启PDF附件

# —— 千问：阿里云百炼 / DashScope（OpenAI 兼容接口） ——
llm:
  provider: "dashscope"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  # 也可改为 https://<WorkspaceId>.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  # 国际站使用与 API Key 地域一致的 endpoint；不要使用千问聊天网页地址。
  model: "qwen-plus"
  api_key_env: "DASHSCOPE_API_KEY"
  fail_on_error: true      # 摘要/翻译失败时不将论文标记已读，可在修复后重跑

  system_prompt_en: |
    You are a researcher in semi-supervised medical image segmentation. Based only on
    the supplied metadata and abstract, summarize the motivation, method and results.
    Include the use of labeled and unlabeled images, pseudo-labeling, teacher-student
    learning or consistency regularization when stated. Preserve reported label budgets,
    modalities, datasets, Dice and HD95 values. Never invent missing numbers, results,
    clinical claims or experimental details. State when these are not reported.
  system_prompt_zh: |
    你是半监督医学图像分割方向的研究助手。仅依据给定元信息与摘要，总结动机、方法和结果。
    关注标注与未标注样本的利用、伪标签、师生模型和一致性约束，但仅在原文涉及时描述。
    保留原文报告的标注比例、成像模态、数据集及 Dice、HD95 等指标；未报告的内容明确说明，
    不编造实验数字、临床效果或实验设置。

# —— 中文翻译设置（用 LLM 翻译 title/summary） ——
translate:
  enabled: true         # 是否启用
  lang: "zh"            # 目前只需中文；也可扩展 en/ja 等
  fields: ["title", "summary"]   # 可扩：["title","summary","comments"]

site:
  enabled: true
  dir: "docs" 
  title: "半监督医学图像分割 · arXiv 论文速递"
  keep_runs: 1024         # 历史保留期（按页面份数）
  theme: "light"        # "light" | "dark" | "auto"
  accent: "#2563eb"     # 主题色（可自定义）

freshness:
  since_days: 7             # 滚动一周，覆盖周末/短暂失败；首次回溯可临时增大
  unique_only: true       # 开启跨天去重（见过的 arXiv ID 不再重复发）
  state_path: ".state/seen_semi_supervised_medical.json"  # 独立方向，避免旧方向状态干扰
  fallback_when_empty: false # 当今天无新增时，是否回退展示最近的Top若干（建议false）

scrape:
  html: true               # 先用 HTML 页抓链接
  pdf_if_missing: true     # 若没抓到 code，再去扫 PDF 头部兜底
  pdf_first_page: false    # （可保留为 false；若你想“不管有没有都扫 PDF”，设 true）
  timeout: 10
