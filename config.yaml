categories:
  - "cs.CV"
  - "cs.LG"
  - "cs.AI"
  - "eess.IV"

keywords:
  - "medical image segmentation"

# 仅限定：半监督 AND 分割；不额外限定应用领域或方法。
keyword_groups:
  - ["semi-supervised", "semisupervised"]  # 自动包含 semi supervised 写法

exclude_keywords: []
  
logic: "AND"                 # 组间逻辑：categories 与 keywords 间 AND/OR
max_results: 5
sort_by: "lastUpdatedDate"  # 按更新时间检索；已读论文的 v2/v3 不重复推送
sort_order: "descending"

# zh / en / both
lang: "zh"

# —— 摘要设置 ——
# mode: none / heuristic / llm
summary:
  mode: llm # mode: "heuristic"
  source: "fulltext"  # 下载完整 PDF，逐页解析后分别总结每篇论文
  # scope: tldr / full / both
  scope: "both"
  max_tokens: 12000        # 全文解读的初始输出额度
  max_tokens_limit: 48000  # 遇到 length 时逐次加倍，最多 3 次请求，且不超过此值
  timeout: 180

fulltext:
  timeout: 60
  max_bytes: 134217728  # 128 MiB；流式写临时文件，完整解析后删除
  max_pages: 150
  max_chars: 200000    # 超限明确失败，不静默截断正文
  continue_on_error: true   # 单篇失败保留未读，继续处理后续候选
  max_extra_candidates: 5   # 最多额外尝试 5 篇，尽量补足 max_results

# —— 邮件发送（QQ 邮箱） ——
email:
  enabled: true
  subject: "[arXiv] Daily Digest"
  smtp_server: "smtp.qq.com"
  smtp_port: 587
  smtp_pass_env: "SMTP_PASS"
  tls: "starttls"  # auto / ssl / starttls
  debug: false     # true 可打印 SMTP 调试日志
  detail: "full"  # simple / full
  max_items: 30
  attach_md: true  # 是否开启Markdown附件
  attach_pdf: false  # 是否开启PDF附件

# —— 千问平台 / 百炼入口，实际调用 DeepSeek ——
llm:
  provider: "dashscope"
  base_url: "https://maas.qianwenaiapi.com/compatible-mode/v1"
  # 也可改为 https://<WorkspaceId>.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  # 国际站使用与 API Key 地域一致的 endpoint；不要使用千问聊天网页地址。
  model: "deepseek-v4.1-flash-1017"
  api_key_env: "DASHSCOPE_API_KEY"
  fail_on_error: true      # 摘要/翻译失败时不将论文标记已读，可在修复后重跑

  system_prompt_en: |
    You are a precise academic reading assistant. Ground your explanations in the
    supplied paper text. Explain methods and experimental evidence clearly, preserve
    reported conditions and numbers, distinguish authors' claims from interpretation,
    and identify missing or unreadable information without guessing.
  system_prompt_zh: |
    你是严谨的论文阅读助手。依据提供的论文正文解释方法与实验证据，保留结果对应的
    实验条件和数字，区分作者主张与分析意见；未报告或无法辨认的信息明确说明，不猜测。

# —— 中文翻译设置（用 LLM 翻译 title/summary） ——
translate:
  enabled: true         # 是否启用
  lang: "zh"            # 目前只需中文；也可扩展 en/ja 等
  fields: ["title", "summary"]   # 可扩：["title","summary","comments"]

site:
  enabled: true
  dir: "docs" 
  title: "arXiv 论文速递"
  keep_runs: 1024         # 历史保留期（按页面份数）
  theme: "light"        # "light" | "dark" | "auto"
  accent: "#2563eb"     # 主题色（可自定义）

freshness:
  since_days: 365           # 按当前配置回溯最近 365 天
  unique_only: true       # 开启跨天去重（见过的 arXiv ID 不再重复发）
  state_path: ".state/seen.json"
  fallback_when_empty: false # 当今天无新增时，是否回退展示最近的Top若干（建议false）

scrape:
  html: true               # 先用 HTML 页抓链接
  pdf_if_missing: true     # 若没抓到 code，再去扫 PDF 头部兜底
  pdf_first_page: false    # （可保留为 false；若你想“不管有没有都扫 PDF”，设 true）
  timeout: 10
